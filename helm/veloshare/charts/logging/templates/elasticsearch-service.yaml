{{- if .Values.global.logging.enabled }}
apiVersion: v1
kind: Service
metadata:
  # Fixed name: services reach Elasticsearch at
  # http://elasticsearch.veloshare.svc.cluster.local:9200
  name: elasticsearch
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  type: ClusterIP
  selector:
    {{- include "veloshare.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
{{- end }}

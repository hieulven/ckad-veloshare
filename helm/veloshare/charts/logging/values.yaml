# Values for the logging subchart.
# Single-node Elasticsearch + Kibana (public images, not VeloShare's own
# services) plus the shared Fluent Bit config consumed by app-pod sidecars.
#
# NOTE: fullnameOverride only affects `veloshare.fullname` if any template in
# this chart uses it. Elasticsearch and Kibana are given FIXED resource names
# ("elasticsearch" / "kibana") instead, because other services reach them by
# those exact in-cluster DNS names — see the templates for details.
fullnameOverride: logging

elasticsearch:
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "8.15.3"
  storage: 2Gi
  heap: "-Xms512m -Xmx512m"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi

kibana:
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: "8.15.3"
  basePath: /kibana
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

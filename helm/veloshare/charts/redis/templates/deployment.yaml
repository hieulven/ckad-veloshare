apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veloshare.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "veloshare.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veloshare.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "veloshare.podSecurityContext" (dict "fsGroup" 999) | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "veloshare.containerSecurityContext" (dict "runAsUser" 999) | nindent 12 }}
          ports:
            - name: redis
              containerPort: {{ .Values.containerPort }}
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}

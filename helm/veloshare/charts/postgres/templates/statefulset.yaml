apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "veloshare.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "veloshare.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "veloshare.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veloshare.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "veloshare.podSecurityContext" (dict "fsGroup" 999) | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "veloshare.containerSecurityContext" (dict "runAsUser" 999) | nindent 12 }}
          ports:
            - name: postgres
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - secretRef:
                name: {{ include "veloshare.fullname" . }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "veloshare"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "veloshare"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: init-sql
          configMap:
            name: {{ include "veloshare.fullname" . }}-init
            # Executable so the postgres entrypoint runs init.sh in its own
            # shell instead of sourcing it (which would leak `set -euo
            # pipefail` into the entrypoint).
            defaultMode: 0755
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}

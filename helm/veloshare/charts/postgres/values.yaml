# Values for the postgres subchart.
# Shared Postgres StatefulSet (schema-per-service). Postgres is a public
# image, not one of VeloShare's own services, so it is pulled straight from
# `image.repository:image.tag` rather than `.Values.global.image.registry`.

# Name resources by the bare name "postgres" so in-cluster DNS matches
# CLAUDE.md's http://postgres.veloshare.svc.cluster.local convention.
fullnameOverride: postgres

image:
  repository: postgres
  tag: "16"

containerPort: 5432

storage: 1Gi

# Startup probe (CKAD O3). Postgres gets a much bigger budget than the Python
# services: 3s x 40 = 120s, because first boot does initdb plus the whole of
# configmap-init.sql (three roles, three schemas) before the socket opens.
# Subsequent boots pass on the first or second check.
startupProbe:
  enabled: true
  periodSeconds: 3
  failureThreshold: 40

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Dev-only placeholder credentials — fine for a learning project, never use
# these (or hardcode secrets like this) in anything real.
# No credentials here. POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB and the
# per-service role passwords used by init.sh come from the `postgres` Secret,
# created outside Helm from env/postgres.env by `make secrets`.

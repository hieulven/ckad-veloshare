{{/*
Blue/green on the real pricing service (CKAD P3 + D6).

When blueGreen.enabled, this file renders TWO Deployments -- pricing-blue and
pricing-green -- from one body. Both carry app.kubernetes.io/name: pricing, so
the NetworkPolicy, the API Ingress and the in-cluster DNS name `pricing` keep
matching either color; the only difference in their labels is `color`, which
is what the Service selects on. Each color's own matchLabels include `color`
too, so the two ReplicaSets never try to adopt each other's Pods.

The `with $root` wrapper re-binds `.` to the chart root inside the range, so
every .Values reference in the body below reads exactly as it would in a
single-Deployment template; only name, labels, replicas and the image tag vary
per color.
*/}}
{{- $root := . -}}
{{- $colors := list -}}
{{- if .Values.blueGreen.enabled -}}
{{- $colors = list (dict "name" "blue" "cfg" .Values.blueGreen.blue) (dict "name" "green" "cfg" .Values.blueGreen.green) -}}
{{- else -}}
{{- $colors = list (dict "name" "" "cfg" (dict "replicaCount" .Values.replicaCount "tag" "")) -}}
{{- end -}}
{{- range $c := $colors }}
---
{{- with $root }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veloshare.fullname" . }}{{ if $c.name }}-{{ $c.name }}{{ end }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
    {{- if $c.name }}
    color: {{ $c.name }}
    {{- end }}
spec:
  replicas: {{ $c.cfg.replicaCount }}
  selector:
    matchLabels:
      {{- include "veloshare.selectorLabels" . | nindent 6 }}
      {{- if $c.name }}
      color: {{ $c.name }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "veloshare.selectorLabels" . | nindent 8 }}
        {{- if $c.name }}
        color: {{ $c.name }}
        {{- end }}
    spec:
      securityContext:
        {{- include "veloshare.podSecurityContext" (dict "fsGroup" 10001) | nindent 8 }}
      initContainers:
        {{- if .Values.configCheck.enabled }}
        {{- include "veloshare.configCheckInit" (dict "requiredVars" .Values.configCheck.requiredVars "envFrom" .Values.configCheck.envFrom "resources" .Values.configCheck.resources) | nindent 8 }}
        {{- end }}
        {{- if .Values.initCheck.enabled }}
        # NOTE: pricing is stateless and depends on neither rider nor a database.
        # This init container is a demonstration of the wait-for-dependency +
        # db-connectivity-check pattern; it intentionally couples pricing to
        # dependencies it does not actually use. Disable with initCheck.enabled=false.
        - name: wait-for-deps
          image: {{ .Values.initCheck.image | quote }}
          securityContext:
            {{- include "veloshare.containerSecurityContext" (dict "runAsUser" 999) | nindent 12 }}
          command:
            - bash
            - -c
            - |
              echo "waiting for rider at ${RIDER_HOST}:${RIDER_PORT} ..."
              until (exec 3<>/dev/tcp/${RIDER_HOST}/${RIDER_PORT}) 2>/dev/null; do
                echo "  rider not reachable yet, retrying in 2s"; sleep 2
              done
              exec 3>&- 2>/dev/null || true
              echo "rider is reachable."

              echo "checking database at ${DB_HOST}:${DB_PORT} ..."
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" >/dev/null 2>&1; do
                echo "  database not accepting connections yet, retrying in 2s"; sleep 2
              done
              echo "database is accepting connections. dependencies satisfied."
          env:
            - name: RIDER_HOST
              value: {{ .Values.initCheck.riderHost | quote }}
            - name: RIDER_PORT
              value: {{ .Values.initCheck.riderPort | quote }}
            - name: DB_HOST
              value: {{ .Values.initCheck.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.initCheck.dbPort | quote }}
          resources:
            {{- toYaml .Values.initCheck.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        # Container name stays `pricing` for both colors, so `kubectl ... -c pricing`
        # and `kubectl set image deploy/pricing-blue pricing=...` read the same
        # either side of a cutover.
        - name: pricing
          image: "{{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ $c.cfg.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "veloshare.containerSecurityContext" (dict "runAsUser" 10001) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "veloshare.fullname" . }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: logs
              mountPath: /var/log/veloshare
            - name: tmp
              mountPath: /tmp
          {{- if .Values.startupProbe.enabled }}
          {{- include "veloshare.startupProbe" (dict "path" .Values.probePath "port" .Values.containerPort "periodSeconds" .Values.startupProbe.periodSeconds "failureThreshold" .Values.startupProbe.failureThreshold) | nindent 10 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.ambassador.enabled }}
        {{- include "veloshare.ambassadorContainer" (dict "port" .Values.ambassador.port "resources" .Values.ambassador.resources) | nindent 8 }}
        {{- end }}
        {{- include "veloshare.loggingSidecar" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.ambassador.enabled }}
        - name: ambassador-config
          configMap:
            name: {{ include "veloshare.fullname" . }}-ambassador
        {{- include "veloshare.ambassadorVolumes" . | nindent 8 }}
        {{- end }}
        {{- include "veloshare.logVolumes" . | nindent 8 }}
{{- end }}
{{- end }}

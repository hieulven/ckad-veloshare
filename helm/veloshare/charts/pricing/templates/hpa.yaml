{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "veloshare.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
spec:
  # Autoscale the color that is actually serving. The idle color stays at its
  # own fixed replicaCount -- scaling a Deployment that receives no traffic on
  # a CPU target would do nothing anyway, and pinning the HPA to the active
  # color keeps `kubectl get hpa` readable during a cutover.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "veloshare.fullname" . }}{{ if .Values.blueGreen.enabled }}-{{ .Values.blueGreen.activeColor }}{{ end }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

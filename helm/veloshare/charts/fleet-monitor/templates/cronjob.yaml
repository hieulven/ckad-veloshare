apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "veloshare.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  # Keep a week of daily reports so the manager can read recent ones from the
  # Job logs (kubectl -n veloshare logs job/<name>).
  successfulJobsHistoryLimit: {{ .Values.historyLimit }}
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "veloshare.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          containers:
            - name: fleet-monitor
              image: "{{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.global.image.tag }}"
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}
              env:
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
              # Admin DB credentials (POSTGRES_USER/PASSWORD/DB) for the
              # cross-schema report queries, from the postgres Secret created by
              # `make secrets` — never rendered by Helm.
              envFrom:
                - secretRef:
                    name: postgres
              resources:
                {{- toYaml .Values.resources | nindent 16 }}

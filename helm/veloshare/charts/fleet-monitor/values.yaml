# Values for the fleet-monitor subchart.
# Everything that varies for fleet-monitor lives here: image, schedule,
# targets, and resources. `.Values.global.*` (registry/tag/pullPolicy/
# namespace) comes from the umbrella chart.

# Name resources by the bare service name, consistent with the other
# subcharts.
fullnameOverride: fleet-monitor

image:
  repository: fleet-monitor

schedule: "*/5 * * * *"

targets: "pricing rider station trip"

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

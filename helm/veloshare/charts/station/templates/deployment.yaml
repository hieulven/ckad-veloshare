apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veloshare.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "veloshare.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veloshare.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "veloshare.podSecurityContext" (dict "fsGroup" 10001) | nindent 8 }}
      initContainers:
        {{- if .Values.configCheck.enabled }}
        {{- include "veloshare.configCheckInit" (dict "requiredVars" .Values.configCheck.requiredVars "envFrom" .Values.configCheck.envFrom "resources" .Values.configCheck.resources) | nindent 8 }}
        {{- end }}
        - name: migrate
          image: postgres:16
          securityContext:
            {{- include "veloshare.containerSecurityContext" (dict "runAsUser" 999) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f /migrations/migrate.sql
          envFrom:
            - secretRef:
                name: {{ include "veloshare.fullname" . }}-db
          volumeMounts:
            - name: migration
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      containers:
        - name: station
          image: "{{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "veloshare.containerSecurityContext" (dict "runAsUser" 10001) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - secretRef:
                name: {{ include "veloshare.fullname" . }}-db
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: logs
              mountPath: /var/log/veloshare
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.ambassador.enabled }}
        {{- include "veloshare.ambassadorContainer" (dict "port" .Values.ambassador.port "resources" .Values.ambassador.resources) | nindent 8 }}
        {{- end }}
        {{- include "veloshare.loggingSidecar" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migration
          configMap:
            name: {{ include "veloshare.fullname" . }}-migration
        {{- if .Values.ambassador.enabled }}
        - name: ambassador-config
          configMap:
            name: {{ include "veloshare.fullname" . }}-ambassador
        {{- include "veloshare.ambassadorVolumes" . | nindent 8 }}
        {{- end }}
        {{- include "veloshare.logVolumes" . | nindent 8 }}

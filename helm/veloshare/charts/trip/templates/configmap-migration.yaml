apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "veloshare.fullname" . }}-migration
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "veloshare.labels" . | nindent 4 }}
data:
  # Applied by the "migrate" init container before the app container starts.
  # The trips schema/role themselves are created once by the postgres
  # subchart's init.sql (schema-per-service, per CLAUDE.md).
  migrate.sql: |
    CREATE TABLE IF NOT EXISTS trips (
      id serial PRIMARY KEY,
      rider_id int NOT NULL,
      start_station int NOT NULL,
      end_station int,
      tier text NOT NULL,
      started_at timestamptz NOT NULL DEFAULT now(),
      ended_at timestamptz,
      fare_cents int,
      status text NOT NULL DEFAULT 'active'
    );

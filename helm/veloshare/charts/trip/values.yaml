# Values for the trip subchart.
# Everything that varies for trip lives here: image, port, env, replicas,
# resources, probe paths, and this service's Postgres/Redis/peer-service
# wiring. `.Values.global.*` (registry/tag/pullPolicy/namespace) comes from
# the umbrella chart.

# Name resources by the bare service name so in-cluster DNS matches CLAUDE.md's
# http://<service>.veloshare.svc.cluster.local convention.
fullnameOverride: trip

replicaCount: 1

image:
  repository: trip

service:
  port: 80

containerPort: 8000

probePath: /healthz

# Startup probe (CKAD O3) -- see veloshare.startupProbe in _helpers.tpl.
# While this is still failing the kubelet runs NEITHER liveness nor readiness,
# so a slow first boot (uvicorn import plus asyncpg pool creation against a cold Postgres and Redis) can never be
# misread as a hang and restarted mid-startup. 2s x 30 = a 60s budget to come
# up; it passes once and then never runs again, after which livenessProbe's
# deliberately tighter 30s-to-failure window applies -- that budget is for
# *starting*, not for running.
# livenessProbe.initialDelaySeconds stays at 5 so the probes are still sane if
# this is disabled; with it enabled that delay is a no-op (the startup gate has
# always already elapsed by then).
startupProbe:
  enabled: true
  periodSeconds: 2
  failureThreshold: 30

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 150m
    memory: 192Mi

# Dev-only placeholder credentials for the trips schema/role (created by the
# postgres subchart's init.sql). Never use hardcoded secrets like this in
# anything real.
# No DB config here. DB_HOST/PORT/NAME/USER/PASSWORD/SCHEMA come from the
# `trip-db` Secret, created outside Helm from env/trip.env by `make secrets`.
# JWT_SECRET (to verify tokens) comes from the shared `veloshare-auth` Secret.

# Peer services and Redis this service calls at runtime (trip is the first
# service-to-service caller in VeloShare).
deps:
  pricingUrl: http://pricing.veloshare.svc.cluster.local
  riderUrl: http://rider.veloshare.svc.cluster.local
  redisHost: redis
  redisPort: 6379
  activeTtlSeconds: 7200

logging:
  enabled: true   # effective flag is global.logging.enabled

# CKAD learning demo of the ambassador pattern (see veloshare.ambassadorContainer
# in _helpers.tpl): a local nginx sits in the Pod in front of trip and proxies
# to it over 127.0.0.1. The Service targets this port instead of containerPort
# when enabled.
ambassador:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# CKAD learning demo of the init-container pattern (see veloshare.configCheckInit
# in _helpers.tpl) — fails fast, before migrate/app/ambassador start, if any of
# these (sourced from the same trip-db + trip ConfigMap + veloshare-auth Secret
# as the app) is missing. Mirrors the require_env() calls in trip/main.py.
configCheck:
  enabled: true
  requiredVars:
    - DB_PASSWORD
    - JWT_SECRET
  envFrom:
    - secretRef:
        name: trip-db
    - configMapRef:
        name: trip
    - secretRef:
        name: veloshare-auth
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Schema migration init container (psql). Runs migrate.sql from the
# <svc>-migration ConfigMap before the app container starts. Needs a little
# more headroom than config-check since it's a real postgres client.
migrate:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

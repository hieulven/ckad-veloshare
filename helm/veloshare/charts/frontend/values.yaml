# Values for the frontend subchart.
# Everything that varies for frontend lives here: image, port, replicas,
# resources. `.Values.global.*` (registry/tag/pullPolicy/namespace) comes
# from the umbrella chart.

# Name resources by the bare service name so in-cluster DNS matches CLAUDE.md's
# http://<service>.veloshare.svc.cluster.local convention.
fullnameOverride: frontend

replicaCount: 1

image:
  repository: frontend

service:
  port: 80

containerPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

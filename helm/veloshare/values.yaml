# VeloShare umbrella values.
#
# This file owns the GLOBAL settings shared by every subchart and holds a
# per-service override block (one key per subchart). For now the per-service
# blocks are intentionally empty — each will be filled in as its subchart is
# implemented, following the build order in CLAUDE.md.

# ---------------------------------------------------------------------------
# Global values — visible to every subchart as `.Values.global.*`.
# ---------------------------------------------------------------------------
global:
  # Single namespace for the whole platform (created via --create-namespace).
  namespace: veloshare

  # Container image registry + tag shared by all app images. Subcharts build
  # their full image reference as `<registry>/<repository>:<tag>`.
  image:
    registry: veloshare
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # Ingress for the platform. An empty `host` leaves the rule host-less so it
  # matches ANY Host header — http://localhost/ works straight from a browser
  # with no /etc/hosts entry. Set host: veloshare.local to restrict it.
  ingress:
    enabled: true
    host: ""
    className: nginx

  # Elasticsearch + Kibana. OFF by default: the two of them add ~350m CPU /
  # 400Mi requested and ~1500m CPU / 640Mi limited on top of the core stack,
  # which does not fit under global.resourceQuota below (see the sizing note
  # there). With this off, the Fluent Bit `log-agent` sidecar stays on every
  # app Pod and ships to its own stdout instead of Elasticsearch, so the
  # sidecar + shared `logs` emptyDir pattern is still live and inspectable:
  #   kubectl -n veloshare logs deploy/<service> -c log-agent
  # Turn it back on with `--set global.logging.enabled=true`, but raise
  # global.resourceQuota first or the elasticsearch/kibana Pods are rejected.
  logging:
    enabled: false

  # NetworkPolicy isolation on the backend API services. This IS enforced on
  # this cluster — kindnet (kind's default CNI) implements NetworkPolicy, so
  # no extra CNI install is needed. Allows the ingress-nginx controller, the
  # frontend, and backend-to-backend traffic; denies everything else, in both
  # directions. See helm/veloshare/templates/networkpolicy-backend.yaml for
  # the per-rule reasoning and a command that demonstrates the denial.
  networkPolicy:
    enabled: true

  # CKAD learning demo of the RBAC + in-cluster API access pattern: a
  # ServiceAccount + Role + RoleBinding scoped to "list/get/watch pods" in
  # this namespace, bound to a pod-lister CronJob whose Pod uses its mounted
  # SA token to call the Kubernetes API and list Pods once per run. See
  # helm/veloshare/templates/rbac-demo-*.yaml. Trigger on demand any time with:
  #   kubectl -n veloshare create job --from=cronjob/pod-lister run-now
  rbacDemo:
    enabled: true
    schedule: "*/5 * * * *"
    historyLimit: 3
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # CKAD learning demo of namespace resource governance. ResourceQuota caps
  # the AGGREGATE across every Pod in the namespace; LimitRange bounds what
  # ANY SINGLE container may request/limit and fills in defaults for a
  # container that specifies none.
  #
  # Sized around the 8 core app Pods (rider/station/trip/frontend/postgres/
  # redis + BOTH pricing colors, each with its ambassador and log-agent
  # sidecars), which is what global.logging.enabled=false renders. Measured
  # from the actual render: 360m CPU / 1168Mi requested, 1900m CPU / 2464Mi
  # limited. Blue/green is what moved these numbers — pricing-green is a
  # second full app Pod (45m/176Mi requested) that exists at all times so the
  # Service selector can be flipped onto a warm target instantly, which is the
  # entire point of blue/green over a rolling update.
  #
  # The headroom on top of that measurement covers, in order of size:
  #   - a rolling update surging one extra API Pod (+45m / +176Mi requested)
  #   - the two CronJob Pods (fleet-monitor, pod-lister) when they overlap
  # It does NOT cover the pricing HPA scaling blue to its maxReplicas of 5 —
  # quota beats HPA, and a scale-out that hits the cap stops there with a
  # FailedCreate event rather than being scheduled. That is correct behavior
  # and worth demonstrating, not a sizing bug.
  #
  # Enabling global.logging adds elasticsearch + kibana (~350m/400Mi more
  # requested, ~1500m/640Mi more limited), which pushes every one of the four
  # dimensions below over the cap and gets those Pods REJECTED. To run the
  # EFK stack, raise this quota at the same time, e.g.:
  #   helm upgrade ... --set global.logging.enabled=true \
  #     --set global.resourceQuota.requests.cpu=1200m \
  #     --set global.resourceQuota.requests.memory=2Gi \
  #     --set global.resourceQuota.limits.cpu=5 \
  #     --set global.resourceQuota.limits.memory=4Gi
  # Leaving logging off and shrinking this quota is also the easiest way to
  # demonstrate ResourceQuota rejection live — see docs/ckad-checklist.md (C5).
  resourceQuota:
    enabled: true
    requests:
      cpu: 600m
      memory: 1600Mi
    limits:
      cpu: "3"
      memory: 3Gi
    pods: "20"

  limitRange:
    enabled: true
    # Only applies to a container that omits resources entirely — every
    # container in this chart already sets its own, so these only kick in
    # for an ad-hoc `kubectl run` test pod.
    default:
      cpu: 100m
      memory: 128Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
    # Bounds every container must fall within, existing or new. max must
    # stay >= the largest single container limit already in the platform
    # (elasticsearch: 1 CPU / postgres: 512Mi) or the next `make deploy`
    # would start rejecting our own Pods.
    min:
      cpu: 5m
      memory: 16Mi
    max:
      cpu: "2"
      memory: 1Gi

  # NOTE: there is deliberately no auth/credential config here.
  # Every secret (JWT signing key, admin login, DB passwords) lives ONLY in the
  # local, gitignored env/*.env files and is applied straight to the cluster as
  # a Secret by `make secrets`. Helm never reads or renders a credential, so
  # nothing sensitive can leak into a rendered manifest or into git.
  # See env/*.env.template and the "Quản lý secret" section of README.md.

# ---------------------------------------------------------------------------
# Per-service override blocks. Keys must match the subchart names so values
# land in the right subchart. Left empty until each subchart is implemented.
# ---------------------------------------------------------------------------
pricing:
  image:
    repository: pricing
  fare:
    unlockFeeCents: 100
    tierRatesJson: '{"standard": 15, "member": 8, "day_pass": 5}'
postgres: {}
rider: {}
station: {}
trip: {}
redis: {}
fleet-monitor: {}
frontend: {}
logging: {}

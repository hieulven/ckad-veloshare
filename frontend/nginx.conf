server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/pricing/ {
        proxy_pass http://pricing/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /api/riders/ {
        proxy_pass http://rider/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /api/stations/ {
        proxy_pass http://station/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /api/trips/ {
        proxy_pass http://trip/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}

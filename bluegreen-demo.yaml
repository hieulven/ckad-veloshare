# CKAD learning lab: blue/green deployment via a single Service selector
# flip. Two independent Deployments (color: blue / color: green) run at
# once; the Service only ever points at one of them at a time. Cutting
# traffic over is a one-line patch to the Service's selector — neither
# Deployment is touched, so it's instant and trivially reversible.
#
# Not part of the Helm chart — a standalone lab, like pvc-demo.yaml and
# probes-demo.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bluegreen-demo-blue-html
  namespace: veloshare
data:
  index.html: |
    <h1>BLUE</h1>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bluegreen-demo-green-html
  namespace: veloshare
data:
  index.html: |
    <h1>GREEN</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluegreen-demo-blue
  namespace: veloshare
  labels:
    app.kubernetes.io/part-of: veloshare
    app.kubernetes.io/component: bluegreen-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bluegreen-demo
      color: blue
  template:
    metadata:
      labels:
        app: bluegreen-demo
        color: blue
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: html
          configMap:
            name: bluegreen-demo-blue-html
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluegreen-demo-green
  namespace: veloshare
  labels:
    app.kubernetes.io/part-of: veloshare
    app.kubernetes.io/component: bluegreen-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bluegreen-demo
      color: green
  template:
    metadata:
      labels:
        app: bluegreen-demo
        color: green
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: html
          configMap:
            name: bluegreen-demo-green-html
---
# Starts pointed at blue. Flip traffic with:
#   kubectl -n veloshare patch svc bluegreen-demo -p '{"spec":{"selector":{"color":"green"}}}'
# and back with "blue" — neither Deployment is touched either way.
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-demo
  namespace: veloshare
spec:
  selector:
    app: bluegreen-demo
    color: blue
  ports:
    - port: 80
      targetPort: 8080

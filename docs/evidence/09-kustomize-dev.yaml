apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    veloshare.io/environment: dev
  labels:
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: veloshare
  name: postgres
  namespace: veloshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: veloshare
      app.kubernetes.io/name: postgres
  serviceName: postgres
  template:
    metadata:
      annotations:
        veloshare.io/environment: dev
      labels:
        app.kubernetes.io/instance: veloshare
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: postgres
        image: postgres:16
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - veloshare
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - veloshare
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-sql
          readOnly: true
        - mountPath: /var/run/postgresql
          name: run
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          defaultMode: 493
          name: postgres-init
        name: init-sql
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: tmp
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    veloshare.io/environment: dev
  labels:
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: veloshare
  name: pricing
  namespace: veloshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: veloshare
      app.kubernetes.io/name: pricing
  template:
    metadata:
      annotations:
        veloshare.io/environment: dev
      labels:
        app.kubernetes.io/instance: veloshare
        app.kubernetes.io/name: pricing
    spec:
      containers:
      - env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        envFrom:
        - configMapRef:
            name: pricing
        image: veloshare/pricing:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        name: pricing
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 150m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - mountPath: /var/log/veloshare
          name: logs
        - mountPath: /tmp
          name: tmp
      - image: nginxinc/nginx-unprivileged:1.27-alpine
        name: ambassador
        ports:
        - containerPort: 8080
          name: ambassador
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 101
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: ambassador-config
          readOnly: true
          subPath: default.conf
        - mountPath: /tmp
          name: ambassador-tmp
        - mountPath: /var/cache/nginx
          name: ambassador-cache
      - image: fluent/fluent-bit:3.1.9
        imagePullPolicy: IfNotPresent
        name: log-agent
        resources:
          limits:
            cpu: 50m
            memory: 96Mi
          requests:
            cpu: 10m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /var/log/veloshare
          name: logs
          readOnly: true
        - mountPath: /fluent-bit/etc/
          name: fluent-bit-config
      initContainers:
      - command:
        - sh
        - -c
        - |
          echo "config check passed: all required env vars present"
        envFrom:
        - configMapRef:
            name: pricing
        image: alpine:3.20
        name: config-check
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      - command:
        - bash
        - -c
        - |
          echo "waiting for rider at ${RIDER_HOST}:${RIDER_PORT} ..."
          until (exec 3<>/dev/tcp/${RIDER_HOST}/${RIDER_PORT}) 2>/dev/null; do
            echo "  rider not reachable yet, retrying in 2s"; sleep 2
          done
          exec 3>&- 2>/dev/null || true
          echo "rider is reachable."

          echo "checking database at ${DB_HOST}:${DB_PORT} ..."
          until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" >/dev/null 2>&1; do
            echo "  database not accepting connections yet, retrying in 2s"; sleep 2
          done
          echo "database is accepting connections. dependencies satisfied."
        env:
        - name: RIDER_HOST
          value: rider
        - name: RIDER_PORT
          value: "80"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        image: postgres:16
        name: wait-for-deps
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
      - configMap:
          name: pricing-ambassador
        name: ambassador-config
      - emptyDir: {}
        name: ambassador-tmp
      - emptyDir: {}
        name: ambassador-cache
      - emptyDir: {}
        name: logs
      - configMap:
          name: fluent-bit-config
        name: fluent-bit-config
---

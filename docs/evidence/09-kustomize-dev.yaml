apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    veloshare.io/environment: dev
  labels:
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/name: fleet-monitor
    app.kubernetes.io/part-of: veloshare
  name: fleet-monitor
  namespace: veloshare
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      annotations:
        veloshare.io/environment: dev
    spec:
      template:
        metadata:
          annotations:
            veloshare.io/environment: dev
          labels:
            app.kubernetes.io/instance: veloshare
            app.kubernetes.io/name: fleet-monitor
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -o pipefail
              /usr/local/bin/report.sh | tee "/reports/report-$(date -u +%F).log"
            env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            envFrom:
            - secretRef:
                name: postgres
            image: veloshare/fleet-monitor:0.1.0
            imagePullPolicy: IfNotPresent
            name: fleet-monitor
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 10001
              runAsNonRoot: true
              runAsUser: 10001
            volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /reports
              name: reports
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir: {}
            name: tmp
          - name: reports
            persistentVolumeClaim:
              claimName: fleet-monitor-reports
      ttlSecondsAfterFinished: 86400
  schedule: 0 0 * * *

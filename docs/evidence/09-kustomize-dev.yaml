    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: veloshare
  name: frontend
  namespace: veloshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: veloshare
      app.kubernetes.io/name: frontend
  template:
    metadata:
      annotations:
        veloshare.io/environment: dev
      labels:
        app.kubernetes.io/instance: veloshare
        app.kubernetes.io/name: frontend
    spec:
      containers:
      - image: veloshare/frontend:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 101
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/cache/nginx
          name: nginx-cache
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: nginx-cache

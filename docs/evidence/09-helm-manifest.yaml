    app.kubernetes.io/part-of: veloshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
      app.kubernetes.io/instance: veloshare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/instance: veloshare
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-check
          image: alpine:3.20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              echo "config check passed: all required env vars present"
          envFrom:
            - configMapRef:
                name: pricing
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        # NOTE: pricing is stateless and depends on neither rider nor a database.
        # This init container is a demonstration of the wait-for-dependency +
        # db-connectivity-check pattern; it intentionally couples pricing to
        # dependencies it does not actually use. Disable with initCheck.enabled=false.
        - name: wait-for-deps
          image: "postgres:16"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - -c
            - |
              echo "waiting for rider at ${RIDER_HOST}:${RIDER_PORT} ..."
              until (exec 3<>/dev/tcp/${RIDER_HOST}/${RIDER_PORT}) 2>/dev/null; do
                echo "  rider not reachable yet, retrying in 2s"; sleep 2
              done
              exec 3>&- 2>/dev/null || true
              echo "rider is reachable."

              echo "checking database at ${DB_HOST}:${DB_PORT} ..."
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" >/dev/null 2>&1; do
                echo "  database not accepting connections yet, retrying in 2s"; sleep 2
              done

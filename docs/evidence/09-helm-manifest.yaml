# Source: veloshare/charts/rider/templates/configmap-migration.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: rider-migration
  namespace: veloshare
  labels:
    helm.sh/chart: rider-0.1.0
    app.kubernetes.io/name: rider
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: veloshare
data:
  # Unqualified on purpose: the schema is created by the postgres init script
  # and the rider role's search_path is pinned to it, so this lands in the
  # riders schema without the chart needing to know the schema name (it now
  # lives only in env/rider.env -> the rider-db Secret). Matches station/trip.
  migrate.sql: |
    CREATE TABLE IF NOT EXISTS riders (
      id serial PRIMARY KEY,
      name text NOT NULL,
      email text UNIQUE NOT NULL,
      tier text NOT NULL
    );

    ALTER TABLE riders ADD COLUMN IF NOT EXISTS password_hash text;

            app.kubernetes.io/instance: veloshare
            app.kubernetes.io/component: rbac-demo
        spec:
          restartPolicy: Never
          serviceAccountName: pod-lister
          # Explicit even though it's the default — this Pod's whole point is
          # to exercise the mounted SA token against the API server.
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pod-lister
              image: "veloshare/pod-lister:0.1.0"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop:
                    - ALL
              # list-pods.sh reads its own mounted SA token from
              # /var/run/secrets/kubernetes.io/serviceaccount/ and calls the
              # API server directly with curl — the Role above only grants
              # get/list/watch on pods in this namespace, so that's the full
              # extent of what the token can do.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
          volumes:
            - name: tmp
              emptyDir: {}

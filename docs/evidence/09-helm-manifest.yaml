# Source: veloshare/charts/fleet-monitor/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-monitor
  namespace: veloshare
  labels:
    helm.sh/chart: fleet-monitor-0.1.0
    app.kubernetes.io/name: fleet-monitor
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: veloshare
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Time-based cleanup: every finished Job (success or failure) is
      # deleted this long after it completes, regardless of how many have
      # run. Safe to keep short because the actual report content now lives
      # on the "reports" PVC, not in the Job's Pod logs.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fleet-monitor
            app.kubernetes.io/instance: veloshare
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fleet-monitor
              image: "veloshare/fleet-monitor:0.1.0"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop:
                    - ALL
              # Wraps the image's own ENTRYPOINT (report.sh) so its output is
              # teed to a dated file on the "reports" PVC as well as stdout —
              # no image rebuild needed for this, it's a manifest-only change.
              command:
                - sh
                - -c
                - |
                  set -o pipefail
                  /usr/local/bin/report.sh | tee "/reports/report-$(date -u +%F).log"
              env:
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
              # Admin DB credentials (POSTGRES_USER/PASSWORD/DB) for the
              # cross-schema report queries, from the postgres Secret created by
              # `make secrets` — never rendered by Helm.
              envFrom:
                - secretRef:
                    name: postgres
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: reports
                  mountPath: /reports
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
          volumes:
            - name: tmp
              emptyDir: {}
            - name: reports
              persistentVolumeClaim:
                claimName: fleet-monitor-reports

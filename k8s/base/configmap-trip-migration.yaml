apiVersion: v1
kind: ConfigMap
metadata:
  name: trip-migration
  namespace: veloshare
  labels:
    app.kubernetes.io/name: trip
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
data:
  migrate.sql: "CREATE TABLE IF NOT EXISTS trips (\n  id serial PRIMARY KEY,\n  rider_id\
    \ int NOT NULL,\n  start_station int NOT NULL,\n  end_station int,\n  tier text\
    \ NOT NULL,\n  started_at timestamptz NOT NULL DEFAULT now(),\n  ended_at timestamptz,\n\
    \  fare_cents int,\n  status text NOT NULL DEFAULT 'active'\n);\n"

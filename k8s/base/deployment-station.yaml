apiVersion: apps/v1
kind: Deployment
metadata:
  name: station
  namespace: veloshare
  labels:
    app.kubernetes.io/name: station
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: station
      app.kubernetes.io/instance: veloshare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: station
        app.kubernetes.io/instance: veloshare
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: config-check
        image: alpine:3.20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -c
        - "for name in DB_PASSWORD; do\n  eval \"val=\\$$name\"\n  if [ -z \"$val\"\
          \ ]; then\n    echo \"config check failed: required env var $name is not\
          \ set\" >&2\n    exit 1\n  fi\ndone\necho \"config check passed: all required\
          \ env vars present\"\n"
        envFrom:
        - secretRef:
            name: station-db
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      - name: migrate
        image: postgres:16
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -c
        - 'PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"
          -d "$DB_NAME" -v ON_ERROR_STOP=1 -f /migrations/migrate.sql

          '
        envFrom:
        - secretRef:
            name: station-db
        volumeMounts:
        - name: migration
          mountPath: /migrations
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
      containers:
      - name: station
        image: veloshare/station:0.1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - secretRef:
            name: station-db
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        volumeMounts:
        - name: logs
          mountPath: /var/log/veloshare
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          limits:
            cpu: 150m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 96Mi
      - name: ambassador
        image: nginxinc/nginx-unprivileged:1.27-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          capabilities:
            drop:
            - ALL
        ports:
        - name: ambassador
          containerPort: 8080
        volumeMounts:
        - name: ambassador-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: ambassador-tmp
          mountPath: /tmp
        - name: ambassador-cache
          mountPath: /var/cache/nginx
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      - name: log-agent
        image: fluent/fluent-bit:3.1.9
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 50m
            memory: 96Mi
        volumeMounts:
        - name: logs
          mountPath: /var/log/veloshare
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: tmp
        emptyDir: {}
      - name: migration
        configMap:
          name: station-migration
      - name: ambassador-config
        configMap:
          name: station-ambassador
      - name: ambassador-tmp
        emptyDir: {}
      - name: ambassador-cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

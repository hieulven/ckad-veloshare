apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-green
  namespace: veloshare
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
      app.kubernetes.io/instance: veloshare
      color: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/instance: veloshare
        color: green
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: config-check
        image: alpine:3.20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -c
        - 'echo "config check passed: all required env vars present"

          '
        envFrom:
        - configMapRef:
            name: pricing
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      - name: wait-for-deps
        image: postgres:16
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
            - ALL
        command:
        - bash
        - -c
        - "echo \"waiting for rider at ${RIDER_HOST}:${RIDER_PORT} ...\"\nuntil (exec\
          \ 3<>/dev/tcp/${RIDER_HOST}/${RIDER_PORT}) 2>/dev/null; do\n  echo \"  rider\
          \ not reachable yet, retrying in 2s\"; sleep 2\ndone\nexec 3>&- 2>/dev/null\
          \ || true\necho \"rider is reachable.\"\n\necho \"checking database at ${DB_HOST}:${DB_PORT}\
          \ ...\"\nuntil pg_isready -h \"${DB_HOST}\" -p \"${DB_PORT}\" >/dev/null\
          \ 2>&1; do\n  echo \"  database not accepting connections yet, retrying\
          \ in 2s\"; sleep 2\ndone\necho \"database is accepting connections. dependencies\
          \ satisfied.\"\n"
        env:
        - name: RIDER_HOST
          value: rider
        - name: RIDER_PORT
          value: '80'
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: '5432'
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: pricing
        image: veloshare/pricing:0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: pricing
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        volumeMounts:
        - name: logs
          mountPath: /var/log/veloshare
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          limits:
            cpu: 150m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 96Mi
      - name: ambassador
        image: nginxinc/nginx-unprivileged:1.27-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          capabilities:
            drop:
            - ALL
        ports:
        - name: ambassador
          containerPort: 8080
        volumeMounts:
        - name: ambassador-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: ambassador-tmp
          mountPath: /tmp
        - name: ambassador-cache
          mountPath: /var/cache/nginx
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      - name: log-agent
        image: fluent/fluent-bit:3.1.9
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 50m
            memory: 96Mi
        volumeMounts:
        - name: logs
          mountPath: /var/log/veloshare
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: tmp
        emptyDir: {}
      - name: ambassador-config
        configMap:
          name: pricing-ambassador
      - name: ambassador-tmp
        emptyDir: {}
      - name: ambassador-cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

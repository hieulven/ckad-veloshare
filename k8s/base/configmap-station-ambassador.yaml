apiVersion: v1
kind: ConfigMap
metadata:
  name: station-ambassador
  namespace: veloshare
  labels:
    app.kubernetes.io/name: station
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
data:
  default.conf: "server {\n    listen 8080;\n    location / {\n        proxy_pass\
    \ http://127.0.0.1:8000;\n        proxy_set_header Host $host;\n        proxy_set_header\
    \ X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \    }\n}\n"

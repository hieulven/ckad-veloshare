apiVersion: v1
kind: ConfigMap
metadata:
  name: station-migration
  namespace: veloshare
  labels:
    app.kubernetes.io/name: station
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
data:
  migrate.sql: "CREATE TABLE IF NOT EXISTS stations (\n    id serial PRIMARY KEY,\n\
    \    name text NOT NULL,\n    capacity int NOT NULL,\n    docks_available int\
    \ NOT NULL DEFAULT 0\n);\n"

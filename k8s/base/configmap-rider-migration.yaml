apiVersion: v1
kind: ConfigMap
metadata:
  name: rider-migration
  namespace: veloshare
  labels:
    app.kubernetes.io/name: rider
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
data:
  migrate.sql: "CREATE TABLE IF NOT EXISTS riders (\n  id serial PRIMARY KEY,\n  name\
    \ text NOT NULL,\n  email text UNIQUE NOT NULL,\n  tier text NOT NULL\n);\n\n\
    ALTER TABLE riders ADD COLUMN IF NOT EXISTS password_hash text;\n"

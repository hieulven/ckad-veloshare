# Raises the namespace quota to fit the prod overlay's doubled API replicas.
#
# Dev footprint is 360m CPU / 1168Mi requested across 8 Pods (the 8th being
# pricing-green -- blue/green keeps both colors running at all times). Prod adds
# one more replica each for rider/station/trip/frontend and for BOTH pricing
# colors -- and every app Pod is 3 containers (app + ambassador + log-agent), so
# that is 6 Pods / 18 containers more, not 6 containers. The headroom below is
# deliberately generous so a rolling update (which briefly runs maxSurge extra
# Pods) does not wedge against the quota mid-rollout.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: veloshare-quota
  # The namespace must be spelled out: the rendered object in k8s/quota/ carries
  # `namespace: veloshare`, and a patch target without it matches nothing.
  namespace: veloshare
spec:
  hard:
    pods: "30"
    requests.cpu: "1500m"
    requests.memory: "3Gi"
    limits.cpu: "6"
    limits.memory: "8Gi"

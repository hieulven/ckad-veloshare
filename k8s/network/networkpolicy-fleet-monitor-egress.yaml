apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-monitor-egress
  namespace: veloshare
  labels:
    app.kubernetes.io/name: veloshare
    app.kubernetes.io/instance: veloshare
    app.kubernetes.io/part-of: veloshare
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-monitor
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432

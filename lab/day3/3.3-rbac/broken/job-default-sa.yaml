# Lab 3.3, counter-example — the same image with NO serviceAccountName.
#
# It falls back to the namespace's "default" ServiceAccount, which has no
# RoleBinding, so the API server authenticates the token fine and then denies
# the request at authorization.
#
# EXPECTED SYMPTOM — the Job runs to completion, exit code 0, but the output is
# a 403 body rather than a pod list:
#
#   kubectl -n veloshare-lab logs job/lab-pod-lister-denied
#     --- ... pods in veloshare-lab (via SA token) ---
#       (unexpected response: pods is forbidden: User
#        "system:serviceaccount:veloshare-lab:default" cannot list resource
#        "pods" in API group "" in the namespace "veloshare-lab")
#
# The lesson: RBAC failures are 403s in a response body, not crashes. A Job that
# "succeeded" can still have done nothing. Read the logs, not just the status.
apiVersion: batch/v1
kind: Job
metadata:
  name: lab-pod-lister-denied
  namespace: veloshare-lab
  labels:
    app.kubernetes.io/name: pod-lister
    app.kubernetes.io/part-of: veloshare
    app.kubernetes.io/component: ckad-lab
    lab: "3.3"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-lister
        app.kubernetes.io/part-of: veloshare
        lab: "3.3"
    spec:
      restartPolicy: Never
      # <-- no serviceAccountName. Gets "default", which grants nothing.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pod-lister
          image: veloshare/pod-lister:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

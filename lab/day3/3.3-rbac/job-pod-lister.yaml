# Lab 3.3 — a Pod that uses its ServiceAccount token to call the Kubernetes API.
#
# veloshare/pod-lister:0.1.0 runs services/pod-lister/list-pods.sh, which calls
# the API server with plain curl rather than kubectl, so the whole chain is
# visible in one script:
#
#   /var/run/secrets/kubernetes.io/serviceaccount/token  ->  Authorization: Bearer
#   /var/run/secrets/kubernetes.io/serviceaccount/ca.crt ->  --cacert
#   /var/run/secrets/kubernetes.io/serviceaccount/namespace -> the URL path
#
# A Job rather than a CronJob: the platform version is a CronJob on a 5-minute
# schedule (helm/veloshare/templates/rbac-demo-cronjob.yaml), which is the wrong
# shape for a lab where you want the answer now.
apiVersion: batch/v1
kind: Job
metadata:
  name: lab-pod-lister
  namespace: veloshare-lab
  labels:
    app.kubernetes.io/name: pod-lister
    app.kubernetes.io/part-of: veloshare
    app.kubernetes.io/component: ckad-lab
    lab: "3.3"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-lister
        app.kubernetes.io/part-of: veloshare
        lab: "3.3"
    spec:
      restartPolicy: Never
      # THE line that matters. Without it the Pod gets the namespace's
      # "default" ServiceAccount, which is bound to nothing.
      serviceAccountName: lab-pod-lister
      # Default is true; spelled out because the counter-example in broken/
      # turns the same knob the other way.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pod-lister
          image: veloshare/pod-lister:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

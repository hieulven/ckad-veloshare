# Lab 5.2 — a genuinely two-container Pod (pricing + ambassador), which is
# the whole point: `kubectl logs` and `kubectl top` behave differently once
# there is more than one container to choose from.
#
# The ambassador here is exactly the platform's real pattern (see
# veloshare.ambassadorContainer in helm/veloshare/templates/_helpers.tpl,
# used by the pricing subchart): a local nginx on 8080 proxying to the app
# on 127.0.0.1:8000. It is not a toy added just for this lab.
#
# TEACHING MOMENT: `kubectl logs deploy/lab-observe` (no -c) fails on a
# multi-container Pod:
#   error: a container name must be specified for pod lab-observe-<hash>,
#   choose one of: [pricing ambassador]
# That error message IS the lesson -- kubectl refuses to guess which
# container's logs you want. See README Verify.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-observe
  namespace: veloshare-lab
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: veloshare
    app.kubernetes.io/component: ckad-lab
    lab: "5.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
      lab: "5.2"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/part-of: veloshare
        app.kubernetes.io/component: ckad-lab
        lab: "5.2"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing
          image: veloshare/pricing:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: logs
              mountPath: /var/log/veloshare
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi
        - name: ambassador
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          ports:
            - name: ambassador
              containerPort: 8080
          volumeMounts:
            - name: ambassador-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: ambassador-tmp
              mountPath: /tmp
            - name: ambassador-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: ambassador-config
          configMap:
            name: lab-observe-ambassador
        - name: ambassador-tmp
          emptyDir: {}
        - name: ambassador-cache
          emptyDir: {}

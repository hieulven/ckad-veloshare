# Lab 5.3, pair 1 (broken) — spec.selector.matchLabels does not match
# spec.template.metadata.labels. The Deployment schema requires the
# selector to be a subset of the template's labels (so the ReplicaSet it
# creates can actually find the Pods it just created) -- the API server
# validates this at admission, before anything is persisted.
#
# The extra "app.kubernetes.io/instance" label below is what breaks it: the
# selector demands "lab-triage-selector" but the template's Pods are
# stamped "lab-triage-selector-WRONG".
#
# EXPECTED SYMPTOM -- this is a VALIDATION error, not a runtime one. The
# object is never created at all:
#
#   $ kubectl apply -f lab/day5/5.3-broken-yaml/broken/1-deployment-selector.yaml
#   The Deployment "lab-triage-selector" is invalid: spec.template.metadata.labels:
#   Invalid value: map[string]string{"app.kubernetes.io/component":"ckad-lab",
#   "app.kubernetes.io/instance":"lab-triage-selector-WRONG",
#   "app.kubernetes.io/name":"pricing", "app.kubernetes.io/part-of":"veloshare",
#   "lab":"5.3"}: `selector` does not match template `labels`
#
# Contrast with pair 2/3 in this lab, both of which apply cleanly and fail
# later, at runtime -- this is the only one of the three that never gets an
# object created in the first place.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-triage-selector
  namespace: veloshare-lab
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: veloshare
    app.kubernetes.io/component: ckad-lab
    lab: "5.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
      app.kubernetes.io/instance: lab-triage-selector
      lab: "5.3"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/part-of: veloshare
        app.kubernetes.io/component: ckad-lab
        app.kubernetes.io/instance: lab-triage-selector-WRONG   # <-- mismatch
        lab: "5.3"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing
          image: veloshare/pricing:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: logs
              mountPath: /var/log/veloshare
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
